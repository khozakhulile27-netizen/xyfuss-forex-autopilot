[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xyfuss-forex-autopilot"
version = "0.1.0"
description = "Independent evidence-driven Forex autopilot"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sidney Khoza" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "PyYAML>=6.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
