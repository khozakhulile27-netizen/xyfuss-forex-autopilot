name: Python reference tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/ctrader-account-auth-hardening
      - feature/ctrader-oauth-control-centre

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML cryptography
      - name: Compile Python reference implementation
        run: python -m compileall -q xyfuss_forex_autopilot tests scripts
      - name: Run Python test suite
        run: python -m pytest -q
      - name: Check patch whitespace
        run: git diff --check
