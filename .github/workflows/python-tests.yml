name: Forex Python verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python modules
        run: python -m compileall -q xyfuss_forex_autopilot tests
      - name: Run complete Python test suite
        run: python -m pytest -q
