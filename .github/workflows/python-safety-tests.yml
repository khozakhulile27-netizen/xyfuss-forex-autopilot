name: Python safety tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "safety/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q xyfuss_forex_autopilot tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD
