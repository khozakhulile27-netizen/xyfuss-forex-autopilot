services:
  xyfuss:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - xyfuss-data:/opt/xyfuss/data
    environment:
      XYFUSS_DASHBOARD_ACCESS_TOKEN: ${XYFUSS_DASHBOARD_ACCESS_TOKEN}
      XYFUSS_LIVE_TRADING_ENABLED: "false"
      XYFUSS_DEMO_EXECUTION_ENABLED: "false"

volumes:
  xyfuss-data:
